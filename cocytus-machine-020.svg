<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="900" viewBox="0 0 1720 900">
<title>Cocytus 0.2 machine map</title>
<rect width="100%" height="100%" fill="#050505"/>
<style>
.text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill:#eeeeee; }
.dim { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill:#9b9b9b; }
.line { stroke:#d8d8d8; stroke-width:3; fill:none; shape-rendering:crispEdges; }
.thin { stroke:#666; stroke-width:1; fill:none; shape-rendering:crispEdges; }
.box { stroke:#d8d8d8; stroke-width:3; fill:#050505; }
.pending { stroke:#777; stroke-width:3; fill:#050505; stroke-dasharray:12 8; }
</style>
<text x="60" y="70" font-size="38" class="text" text-anchor="start" font-weight="bold">COCYTUS // 0.2 MACHINE MAP</text>
<text x="60" y="108" font-size="20" class="dim" text-anchor="start" font-weight="normal">one visible trust seed / one native language / one fixed-point requirement</text>
<rect x="70" y="170" width="270" height="100" class="box"/>
<text x="205.0" y="210" font-size="27" class="text" text-anchor="middle" font-weight="bold">.coc SOURCE</text>
<text x="205.0" y="243" font-size="19" class="dim" text-anchor="middle" font-weight="normal">native language</text>
<rect x="430" y="170" width="290" height="100" class="box"/>
<text x="575.0" y="210" font-size="27" class="text" text-anchor="middle" font-weight="bold">COMPILER</text>
<text x="575.0" y="243" font-size="19" class="dim" text-anchor="middle" font-weight="normal">eventually .coc itself</text>
<rect x="810" y="170" width="320" height="100" class="box"/>
<text x="970.0" y="210" font-size="27" class="text" text-anchor="middle" font-weight="bold">48-BYTE IMAGE</text>
<text x="970.0" y="243" font-size="19" class="dim" text-anchor="middle" font-weight="normal">deterministic instruction form</text>
<rect x="1220" y="170" width="310" height="100" class="box"/>
<text x="1375.0" y="210" font-size="27" class="text" text-anchor="middle" font-weight="bold">COCYTUS VM</text>
<text x="1375.0" y="243" font-size="19" class="dim" text-anchor="middle" font-weight="normal">bounded execution</text>
<path d="M340,220 L430,220 M430,220 L417.5,228.4 M430,220 L417.5,211.6" class="line"/>
<path d="M720,220 L810,220 M810,220 L797.5,228.4 M810,220 L797.5,211.6" class="line"/>
<path d="M1130,220 L1220,220 M1220,220 L1207.5,228.4 M1220,220 L1207.5,211.6" class="line"/>
<rect x="75" y="390" width="330" height="105" class="box"/>
<text x="240.0" y="430" font-size="27" class="text" text-anchor="middle" font-weight="bold">EXACT DYADICS</text>
<text x="240.0" y="463" font-size="19" class="dim" text-anchor="middle" font-weight="normal">N / 2^M</text>
<rect x="465" y="390" width="330" height="105" class="box"/>
<text x="630.0" y="430" font-size="27" class="text" text-anchor="middle" font-weight="bold">CONWAY CUTS</text>
<text x="630.0" y="463" font-size="19" class="dim" text-anchor="middle" font-weight="normal">finite { L | R }</text>
<rect x="855" y="390" width="330" height="105" class="box"/>
<text x="1020.0" y="430" font-size="27" class="text" text-anchor="middle" font-weight="bold">PROGRAM STATE</text>
<text x="1020.0" y="463" font-size="19" class="dim" text-anchor="middle" font-weight="normal">vars / memory / calls</text>
<rect x="1245" y="390" width="330" height="105" class="box"/>
<text x="1410.0" y="430" font-size="27" class="text" text-anchor="middle" font-weight="bold">CAINA</text>
<text x="1410.0" y="463" font-size="19" class="dim" text-anchor="middle" font-weight="normal">640 x 400 commit</text>
<rect x="250" y="610" width="370" height="100" class="box"/>
<text x="435.0" y="650" font-size="27" class="text" text-anchor="middle" font-weight="bold">ANTENORA</text>
<text x="435.0" y="683" font-size="19" class="dim" text-anchor="middle" font-weight="normal">reversible byte map</text>
<rect x="690" y="610" width="370" height="100" class="box"/>
<text x="875.0" y="650" font-size="27" class="text" text-anchor="middle" font-weight="bold">PTOLOMAEA</text>
<text x="875.0" y="683" font-size="19" class="dim" text-anchor="middle" font-weight="normal">call / return</text>
<rect x="1130" y="610" width="370" height="100" class="box"/>
<text x="1315.0" y="650" font-size="27" class="text" text-anchor="middle" font-weight="bold">JUDECCA</text>
<text x="1315.0" y="683" font-size="19" class="dim" text-anchor="middle" font-weight="normal">access budget / freeze</text>
<text x="60" y="790" font-size="22" class="dim" text-anchor="start" font-weight="normal">0.2 adds a compiler-level invariant:</text>
<text x="60" y="835" font-size="27" class="text" text-anchor="start" font-weight="bold">compile the compiler with itself until the executable image stops changing.</text>
</svg>